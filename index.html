<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qui est-ce — Fondation Partage et Vie</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#00767D;
    --teal-dark:#075B60;
    --coral:#F2764E;
    --cream:#FBF6EE;
    --cream-dim:#F0E8D8;
    --ink:#2B2B28;
    --ink-soft:rgba(43,43,40,0.65);
    --ko:#C1503F;
    --line: rgba(43,43,40,0.12);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--teal-dark);
    background-image: radial-gradient(circle at 30% 0%, var(--teal) 0%, var(--teal-dark) 55%);
    color:var(--cream);
    font-family:'Nunito Sans', -apple-system, sans-serif;
    min-height:100vh;
  }
  .headline{
    font-family:'Nunito', sans-serif;
    font-weight:800;
    letter-spacing:-0.01em;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:22px;
  }
  .brand img{height:34px;width:auto;display:block;}
  .brand span{
    font-family:'Nunito',sans-serif;
    font-weight:700;
    font-size:14px;
    color:var(--cream);
    opacity:0.9;
  }
  #app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding:28px 20px 40px;
  }
  .tag{
    font-size:13px;
    color:var(--coral);
    font-weight:700;
    letter-spacing:0.02em;
    margin-bottom:6px;
  }
  h1.headline{
    font-size:28px;
    margin:0 0 6px;
    line-height:1.2;
    color:#fff;
  }
  p.lead{
    color:rgba(251,246,238,0.78);
    font-size:15px;
    line-height:1.5;
    margin:0 0 24px;
  }
  input[type=text]{
    width:100%;
    padding:14px 16px;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--cream);
    color:var(--ink);
    font-size:16px;
    font-family:inherit;
  }
  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
  }
  .btn-primary{
    margin-top:16px;
    background:var(--coral);
    color:#fff;
    font-weight:700;
    font-size:15px;
    padding:14px 20px;
    border-radius:30px;
    width:100%;
    box-shadow:0 6px 16px rgba(242,118,78,0.35);
  }
  .btn-primary:disabled{opacity:0.4;box-shadow:none;cursor:default;}
  .btn-ghost{
    background:transparent;
    color:rgba(251,246,238,0.7);
    text-decoration:underline;
    font-size:13px;
    padding:10px 0;
    margin-top:auto;
    align-self:center;
  }
  .dossier{
    background:var(--cream);
    color:var(--ink);
    border-radius:20px;
    padding:26px;
    position:relative;
    overflow:hidden;
  }
  .dossier::before{
    content:attr(data-num);
    position:absolute;
    top:16px;
    right:20px;
    font-family:'Nunito Sans',sans-serif;
    font-weight:700;
    font-size:12px;
    color:var(--teal);
    letter-spacing:0.04em;
  }
  .avatar{
    width:112px;
    height:112px;
    border-radius:50%;
    margin:0 auto 18px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Nunito',sans-serif;
    font-size:40px;
    font-weight:800;
    color:#fff;
    background:linear-gradient(135deg, var(--teal), var(--teal-dark));
  }
  .avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
  .qmark{font-size:48px;}
  .question-title{
    text-align:center;
    font-family:'Nunito',sans-serif;
    font-weight:800;
    font-size:21px;
    margin:0 0 22px;
    color:var(--teal-dark);
  }
  .options{display:flex;flex-direction:column;gap:10px;}
  .opt{
    background:#fff;
    border:1px solid var(--line);
    padding:13px 16px;
    border-radius:14px;
    text-align:left;
    font-size:15px;
    font-weight:600;
    color:var(--ink);
  }
  .opt.correct{background:var(--teal);border-color:var(--teal);color:#fff;}
  .opt.wrong{background:var(--ko);border-color:var(--ko);color:#fff;}
  .opt.dim{opacity:0.4;}
  .reveal{margin-top:20px;text-align:center;}
  .reveal .name{font-family:'Nunito',sans-serif;font-weight:800;font-size:20px;margin:0 0 2px;color:var(--teal-dark);}
  .reveal .role{color:var(--coral);font-weight:700;font-size:13px;margin:0 0 12px;}
  .reveal .desc{font-size:14px;line-height:1.55;color:var(--ink);text-align:left;}
  .verdict{
    font-size:13px;
    font-weight:800;
    letter-spacing:0.02em;
    margin-bottom:14px;
  }
  .verdict.ok{color:var(--teal);}
  .verdict.ko{color:var(--ko);}
  .progress{
    display:flex;gap:5px;margin-bottom:22px;
  }
  .progress span{
    flex:1;height:4px;background:rgba(251,246,238,0.25);border-radius:2px;
  }
  .progress span.done{background:var(--coral);}
  .timer{
    display:flex;align-items:center;gap:8px;
    margin-bottom:16px;
    font-family:'Nunito',sans-serif;font-weight:800;font-size:13px;color:var(--teal-dark);
  }
  .timer-track{
    flex:1;height:6px;border-radius:4px;background:var(--line);overflow:hidden;
  }
  .timer-bar{
    height:100%;width:100%;background:var(--teal);
    transition:width 1s linear, background-color .3s;
  }
  .timer-bar.low{background:var(--ko);}
  .score-final{
    text-align:center;
  }
  .score-final .big{font-family:'Nunito',sans-serif;font-weight:800;font-size:52px;margin:12px 0 4px;color:var(--teal-dark);}
  .score-final .sub{color:var(--ink-soft);font-size:14px;}
  table{width:100%;border-collapse:collapse;margin-top:18px;}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);font-size:14px;}
  th{color:var(--ink-soft);font-weight:700;font-size:12px;letter-spacing:0.04em;}
  .rank{color:var(--coral);font-family:'Nunito',sans-serif;font-weight:800;font-size:16px;}
  #qrbox{background:var(--cream);padding:16px;border-radius:16px;display:inline-block;margin:14px 0;}
  .delete-participant{
    background:transparent;
    border:1px solid var(--ko);
    color:var(--ko);
    font-size:12px;
    font-weight:700;
    padding:5px 10px;
    border-radius:8px;
    white-space:nowrap;
  }
  .delete-participant:hover{background:var(--ko);color:#fff;}
  .admin-link{margin-top:30px;text-align:center;}
  .admin-link a{color:rgba(251,246,238,0.65);font-size:12px;text-decoration:underline;}
</style>
</head>

const app = document.getElementById('app');
const hash = window.location.hash;

function initials(name){
  return name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
}
function avatarHTML(profile, big){
  if(big){
    return `<div class="avatar"><span class="qmark">?</span></div>`;
  }
  if(profile.photo){
    return `<div class="avatar"><img src="${profile.photo}" alt=""></div>`;
  }
  return `<div class="avatar">${initials(profile.name)}</div>`;
}
const API_URL = "https://script.google.com/macros/s/AKfycby6IS6_6hLHBghecGU3JRv1_PUH3C17kB0hOp5zarxLIbT-q9QdiFRojm7PSvSdEbVT/exec";

async function apiCall(action, payload = {}){
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, ...payload })
  });
  return await res.json();
}
const localLock = {
  get(){
    try{ const v = localStorage.getItem('hasPlayed'); return v ? JSON.parse(v) : null; }
    catch(e){ return null; }
  },
  set(value){
    try{ localStorage.setItem('hasPlayed', JSON.stringify(value)); }catch(e){}
  },
  clear(){
    try{ localStorage.removeItem('hasPlayed'); }catch(e){}
  }
};
async function renderAdmin(){
  app.innerHTML = `
    <div class="brand"><img src="https://www.fondationpartageetvie.org/plugins/FPVInternetPlugin/assets/svg/logo-fpv.svg" alt="Fondation Partage et Vie"><span>Fondation Partage et Vie</span></div>
    <div class="tag">MODE ORGANISATEUR</div>
    <h1 class="headline">Résultats en direct</h1>
    <p class="lead">Faites scanner ce code aux participants pour qu'ils lancent le jeu quand ils le souhaitent.</p>
    <div style="text-align:center">
      <div id="qrbox"></div>
    </div>
    <div id="leaderboard">Chargement…</div>
    <button class="btn-ghost" id="resetBtn" style="align-self:flex-start;margin-top:24px;">Réinitialiser les résultats</button>
  `;
  const playUrl = window.location.href.split('#')[0] + '#play';
  new QRCode(document.getElementById('qrbox'), { text: playUrl, width:180, height:180, colorDark:"#1B1F2A", colorLight:"#F3EFE6" });

  document.getElementById('resetBtn').onclick = async () => {
    if(!confirm('Effacer tous les résultats ?')) return;
    try{
      await apiCall('resetAll');
      loadResults();
    }catch(e){ console.error(e); }
  };

  async function loadResults(){
    const box = document.getElementById('leaderboard');
    try{
      const r = await apiCall('listResults');
      const rows = r.rows || [];
      if(rows.length === 0){
        box.innerHTML = `<p class="lead" style="margin-top:20px;">Aucun résultat pour l'instant.</p>`;
        return;
      }
      rows.sort((a,b)=> b.score - a.score || a.timeSeconds - b.timeSeconds);
      box.innerHTML = `
        <div class="dossier" style="padding:18px;">
        <table>
          <thead><tr><th></th><th>Participant</th><th>Score</th><th>Temps</th><th></th></tr></thead>
          <tbody>
            ${rows.map((r,i)=>`<tr>
              <td class="rank">${i+1}</td>
              <td>${escapeHTML(r.playerName)}</td>
              <td>${r.score}/${r.totalQuestions || QUESTIONS_PER_GAME}</td>
              <td>${formatTime(r.timeSeconds)}</td>
              <td><button class="delete-participant" data-row="${r.rowIndex}">Supprimer</button></td>
            </tr>`).join('')}
          </tbody>
        </table>
        </div>`;
      box.querySelectorAll('.delete-participant').forEach(b=>{
        b.onclick = async ()=>{
          if(!confirm('Supprimer ce participant ? Il pourra rejouer depuis son appareil.')) return;
          try{ await apiCall('deleteResult', { rowIndex: b.dataset.row }); loadResults(); }catch(e){ console.error(e); }
        };
      });
    }catch(e){
      box.innerHTML = `<p class="lead">Impossible de charger les résultats. Vérifiez que API_URL est bien renseignée dans le code.</p>`;
    }
  }
  loadResults();
  setInterval(loadResults, 3000);
}

function formatTime(s){
  const m = Math.floor(s/60), sec = Math.round(s%60);
  return `${m}m ${sec}s`;
}
function escapeHTML(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- PLAYER VIEW ---------- */
const QUESTIONS_PER_GAME = 7;
function pickQuestions(){
  const shuffled = [...PROFILES].sort(()=>Math.random()-0.7);
  return shuffled.slice(0, Math.min(QUESTIONS_PER_GAME, PROFILES.length));
}

let state = { name:'', qIndex:0, score:0, startTime:0, elapsedTime:0, answered:false, questions:[] };

async function isNameAlreadyUsed(name){
  try{
    const r = await apiCall('checkName', { name });
    return !!r.exists;
  }catch(e){ return false; }
}

function renderAlreadyPlayed(){
  app.innerHTML = `
    <div class="brand"><img src="https://www.fondationpartageetvie.org/plugins/FPVInternetPlugin/assets/svg/logo-fpv.svg" alt="Fondation Partage et Vie"><span>Fondation Partage et Vie</span></div>
    <div class="tag">QUI EST-CE ?</div>
    <h1 class="headline">Vous avez déjà participé</h1>
    <p class="lead">Une seule participation est autorisée par personne. Merci d'avoir joué !</p>
  `;
}

function renderInterrupted(){
  app.innerHTML = `
    <div class="brand"><img src="https://www.fondationpartageetvie.org/plugins/FPVInternetPlugin/assets/svg/logo-fpv.svg" alt="Fondation Partage et Vie"><span>Fondation Partage et Vie</span></div>
    <div class="tag">QUI EST-CE ?</div>
    <h1 class="headline">Votre partie a été interrompue</h1>
    <p class="lead">Il semble qu'un problème technique ait coupé votre partie avant la fin (connexion, fermeture accidentelle...). Vous pouvez la recommencer depuis cet appareil.</p>
    <button class="btn-primary" id="retryBtn">Recommencer ma partie</button>
  `;
  document.getElementById('retryBtn').onclick = async ()=>{
    localLock.clear();
    renderStart();
  };
}

async function renderStart(){
  app.innerHTML = `<p class="lead" style="text-align:center;margin-top:40px;">Chargement…</p>`;

  let lockState = localLock.get();

  if(lockState && lockState.completed){
    const stillRegistered = await isNameAlreadyUsed(lockState.playerName);
    if(stillRegistered){
      renderAlreadyPlayed();
      return;
    }
    // L'organisateur a supprimé ce participant du classement : on lève le verrou local
    // pour lui permettre de rejouer, sans qu'il ait rien à faire lui-même.
    localLock.clear();
    lockState = null;
  }
  if(lockState && !lockState.completed){
    renderInterrupted();
    return;
  }

  app.innerHTML = `
    <div class="brand"><img src="https://www.fondationpartageetvie.org/plugins/FPVInternetPlugin/assets/svg/logo-fpv.svg" alt="Fondation Partage et Vie"><span>Fondation Partage et Vie</span></div>
    <div class="tag">QUI EST-CE ?</div>
    <h1 class="headline">Le jeu de la DAF</h1>
    <p class="lead">${QUESTIONS_PER_GAME} portraits à deviner, tirés au hasard parmi ${PROFILES.length}. Le classement retient d'abord le nombre de bonnes réponses, puis la rapidité. Une seule participation par personne.</p>
    <input type="text" id="nameInput" placeholder="Prénom et nom (ex. Gaulthier Penilleault)" autocomplete="off">
    <button class="btn-primary" id="startBtn" disabled>Commencer</button>
    <p class="lead" id="startError" style="color:var(--coral);display:none;margin-top:10px;"></p>
  `;
  const input = document.getElementById('nameInput');
  const btn = document.getElementById('startBtn');
  const errorMsg = document.getElementById('startError');
  input.addEventListener('input', ()=>{ btn.disabled = input.value.trim().length===0; });
  input.addEventListener('keydown', e=>{ if(e.key==='Enter' && !btn.disabled) btn.click(); });
  btn.onclick = async ()=>{
    const typedName = input.value.trim();
    btn.disabled = true;
    const originalLabel = btn.textContent;
    btn.textContent = 'Vérification…';
    errorMsg.style.display = 'none';

    const nameTaken = await isNameAlreadyUsed(typedName);
    if(nameTaken){
      errorMsg.textContent = 'Ce nom a déjà participé. Une seule participation par personne est autorisée.';
      errorMsg.style.display = 'block';
      btn.disabled = false;
      btn.textContent = originalLabel;
      return;
    }

    localLock.set({
      playerName: typedName,
      completed: false,
      startedAt: new Date().toISOString()
    });

    state.name = typedName;
    state.questions = pickQuestions();
    state.qIndex = 0;
    state.score = 0;
    state.elapsedTime = 0;
    state.answered = false;
    state.startTime = Date.now();
    renderQuestion();
  };
}

function renderProgress(){
  return `<div class="progress">${state.questions.map((_,i)=>`<span class="${i<state.qIndex ? 'done':''}"></span>`).join('')}</div>`;
}

function normalize(str){
  return String(str).trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}

function shuffle(arr){
  return [...arr].sort(()=>Math.random()-0.5);
}

function getOptionsForQuestion(q){
  const others = PROFILES.filter(p => p.id !== q.id).map(p => p.name);
  const distractors = shuffle(others).slice(0, 3);
  return shuffle([q.name, ...distractors]);
}

function renderQuestion(){
  const q = state.questions[state.qIndex];
  state.answered = false;
  state.startTime = Date.now();
  if(state.timerInterval) clearInterval(state.timerInterval);
  const options = getOptionsForQuestion(q);
  const DURATION = 30;
  app.innerHTML = `
    ${renderProgress()}
    <div class="dossier" data-num="Dossier ${state.qIndex+1}/${state.questions.length}">
      <div class="timer"><div class="timer-track"><div class="timer-bar" id="timerBar"></div></div><span id="timerText">${DURATION}</span>s</div>
      ${avatarHTML(q, true)}
      <div class="question-title">${escapeHTML(q.question || "Qui est-ce ?")}</div>
      <div class="options">
        ${options.map(opt=>`<button class="opt" data-name="${escapeHTML(opt)}">${escapeHTML(opt)}</button>`).join('')}
      </div>
      <div id="revealZone"></div>
    </div>
  `;
  app.querySelectorAll('.opt').forEach(btn=>{
    btn.onclick = ()=> handleAnswer(btn, q, false);
  });

  let timeLeft = DURATION;
  const timerText = document.getElementById('timerText');
  const timerBar = document.getElementById('timerBar');
  state.timerInterval = setInterval(()=>{
    timeLeft--;
    timerText.textContent = Math.max(timeLeft, 0);
    timerBar.style.width = (Math.max(timeLeft,0) / DURATION * 100) + '%';
    if(timeLeft <= 10) timerBar.classList.add('low');
    if(timeLeft <= 0){
      clearInterval(state.timerInterval);
      handleAnswer(null, q, true);
    }
  }, 1000);
}

function handleAnswer(btn, q, timedOut){
  if(state.answered) return;
  state.answered = true;
  if(state.timerInterval) clearInterval(state.timerInterval);
  state.elapsedTime += (Date.now() - state.startTime) / 1000;
  const chosen = btn ? btn.dataset.name : null;
  const correct = !timedOut && chosen === q.name;
  if(correct) state.score++;

  app.querySelectorAll('.opt').forEach(o=>{
    o.disabled = true;
    if(o.dataset.name === q.name) o.classList.add('correct');
    else if(o === btn) o.classList.add('wrong');
    else o.classList.add('dim');
  });

  const verdictMsg = correct
    ? 'Bonne réponse'
    : (timedOut ? 'Temps écoulé — mauvaise réponse' : 'Mauvaise réponse');

  document.getElementById('revealZone').innerHTML = `
    <div class="reveal">
      <div class="verdict ${correct?'ok':'ko'}">${verdictMsg}</div>
      ${avatarHTML(q, false)}
      <div class="name">${escapeHTML(q.name)}</div>
      <div class="role">${escapeHTML(q.role)}</div>
      <div class="desc">${escapeHTML(q.description)}</div>
      <button class="btn-primary" id="nextBtn">${state.qIndex < state.questions.length-1 ? 'Suivant' : 'Voir mon score'}</button>
    </div>
  `;
  document.getElementById('nextBtn').onclick = ()=>{
    state.qIndex++;
    if(state.qIndex >= state.questions.length) finish();
    else renderQuestion();
  };
}

async function finish(){
  const timeSeconds = state.elapsedTime;
  app.innerHTML = `
    <div class="dossier score-final">
      <div class="tag" style="text-align:center;">TERMINÉ</div>
      <div class="big headline">${state.score}/${state.questions.length}</div>
      <div class="sub">en ${formatTime(timeSeconds)} — merci ${escapeHTML(state.name)} !</div>
    </div>
    <p class="lead" style="text-align:center;margin-top:20px;" id="saveStatus">Enregistrement du score…</p>
  `;
  try{
    await apiCall('saveResult', {
      playerName: state.name,
      score: state.score,
      totalQuestions: state.questions.length,
      timeSeconds: timeSeconds
    });
    localLock.set({
      playerName: state.name,
      completed: true,
      completedAt: new Date().toISOString()
    });
    document.getElementById('saveStatus').textContent = 'Score enregistré. Vous pouvez fermer cette page.';
  }catch(e){
    document.getElementById('saveStatus').textContent = "Le score n'a pas pu être enregistré (connexion ?).";
  }
}

/* ---------- ROUTING ---------- */
if(hash === '#admin'){
  renderAdmin();
} else {
  renderStart().then(()=>{
    app.insertAdjacentHTML('beforeend', `<div class="admin-link"><a href="#admin" onclick="location.reload()">Mode organisateur</a></div>`);
  });
}
</script>
